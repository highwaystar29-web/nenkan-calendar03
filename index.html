<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>年間カレンダー</title>
<style>
:root{
  --ink:#2b2b2b; --red:#d4251a; --blue:#1a3fd8; --head:#333; --line:#9a9a9a;
  --ch:46px;
}
*{box-sizing:border-box}
body{margin:0;background:#f2f2f2;color:var(--ink);font-family:"Hiragino Sans","Noto Sans JP","Yu Gothic",Meiryo,sans-serif}
.toolbar{display:flex;gap:8px;align-items:center;justify-content:center;padding:12px;flex-wrap:wrap}
.toolbar button{font:inherit;font-size:15px;min-height:44px;padding:0 18px;border:1px solid #333;background:#fff;color:#333;border-radius:6px;cursor:pointer}
.toolbar button[aria-pressed="true"]{background:#333;color:#fff}
.toolbar .note{font-size:12px;color:#555;width:100%;text-align:center}
.page{width:1180px;margin:0 auto 24px;background:#fff;padding:24px 40px 32px}
h1{margin:0 0 8px;text-align:center;font-size:64px;line-height:1.1;font-weight:900;letter-spacing:.02em}
.year{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px 28px}
.month h2{margin:0;text-align:center;font-size:26px;line-height:1.3;font-weight:800}
.grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));border-left:1px solid var(--line);border-top:1px solid var(--line)}
.wd{background:var(--head);color:#fff;text-align:center;font-size:13px;font-weight:700;line-height:22px;border-right:1px solid var(--line);border-bottom:1px solid var(--line)}
.wd.sun{background:var(--red)}
.wd.sat{background:var(--blue)}
.c{height:var(--ch);border-right:1px solid var(--line);border-bottom:1px solid var(--line);display:flex;flex-direction:column;min-width:0;overflow:hidden}
.top{display:flex;align-items:baseline;gap:3px;padding:1px 3px 0;line-height:1.1;min-height:16px}
.n{font-size:14px;font-weight:800}
.h{font-size:8px;font-weight:500;white-space:nowrap;overflow:hidden}
.sun .n,.sun .h,.hol .n,.hol .h{color:var(--red)}
.sat .n{color:var(--blue)}
.memo{flex:1;min-height:0;padding:0 3px 1px;font-size:10px;line-height:1.2;color:#222;overflow:hidden;outline:none;word-break:break-all}
.memo:focus{background:#fff8c8}
.empty{background:#fafafa}
@media print{
  @page{size:A4 portrait;margin:8mm}
  :root{--ch:7.6mm}
  body{background:#fff}
  .toolbar{display:none}
  .page{width:100%;margin:0;padding:0}
  h1{font-size:30pt;margin:0 0 2mm}
  .year{gap:2mm 6mm}
  .month h2{font-size:13pt}
  .wd{font-size:7pt;line-height:4mm}
  .n{font-size:8pt}
  .h{font-size:5pt}
  .memo{font-size:5.5pt;padding:0 .6mm}
  .top{min-height:3.2mm;padding:0 .6mm}
  .c,.grid{break-inside:avoid}
  .month{break-inside:avoid}
  *{-webkit-print-color-adjust:exact;print-color-adjust:exact}
}
</style>
</head>
<body>
<div class="toolbar">
  <button type="button" id="b2026" aria-pressed="false">2026年</button>
  <button type="button" id="b2027" aria-pressed="true">2027年</button>
  <button type="button" id="bsave">保存(JSON)</button>
  <button type="button" id="bload">読み込み(JSON)</button>
  <button type="button" id="bprint">印刷(A4縦)</button>
  <input type="file" id="fileIn" accept=".json,application/json" hidden>
  <div class="note" id="note">日付の下の余白をタップして書き込めます。自動保存はしないので、「保存(JSON)」でファイルに残してください。</div>
</div>
<main class="page">
  <h1 id="title">2027</h1>
  <div class="year" id="cal"></div>
</main>
<script>
(function(){
  var HOL = {
    2026:{'1-1':'元日','1-12':'成人の日','2-11':'建国記念の日','2-23':'天皇誕生日','3-20':'春分の日','4-29':'昭和の日','5-3':'憲法記念日','5-4':'みどりの日','5-5':'こどもの日','5-6':'振替休日','7-20':'海の日','8-11':'山の日','9-21':'敬老の日','9-22':'国民の休日','9-23':'秋分の日','10-12':'スポーツの日','11-3':'文化の日','11-23':'勤労感謝の日'},
    2027:{'1-1':'元日','1-11':'成人の日','2-11':'建国記念の日','2-23':'天皇誕生日','3-21':'春分の日','3-22':'振替休日','4-29':'昭和の日','5-3':'憲法記念日','5-4':'みどりの日','5-5':'こどもの日','7-19':'海の日','8-11':'山の日','9-20':'敬老の日','9-23':'秋分の日','10-11':'スポーツの日','11-3':'文化の日','11-23':'勤労感謝の日'}
  };
  var WD = ['日','月','火','水','木','金','土'];
  var cal = document.getElementById('cal');

  var store = {};
  var dirty = false;
  var currentYear = 2027;
  function load(k){ return store[k] || ''; }
  function save(k, v){ if (v) store[k] = v; else delete store[k]; dirty = true; }
  function say(msg){ document.getElementById('note').textContent = msg; }
  function pad(n){ return n < 10 ? '0' + n : '' + n; }

  function render(year){
    currentYear = year;
    document.getElementById('title').textContent = year;
    document.title = year + '年 年間カレンダー';
    [2026, 2027].forEach(function(y){
      document.getElementById('b' + y).setAttribute('aria-pressed', y === year ? 'true' : 'false');
    });
    var hol = HOL[year] || {};
    var html = '';
    for (var m = 0; m < 12; m++){
      html += '<section class="month"><h2>' + (m + 1) + '</h2><div class="grid">';
      for (var i = 0; i < 7; i++){
        html += '<div class="wd' + (i === 0 ? ' sun' : i === 6 ? ' sat' : '') + '">' + WD[i] + '</div>';
      }
      var first = new Date(year, m, 1).getDay();
      var last = new Date(year, m + 1, 0).getDate();
      for (var cell = 0; cell < 42; cell++){
        var d = cell - first + 1;
        if (d < 1 || d > last){ html += '<div class="c empty"></div>'; continue; }
        var col = cell % 7;
        var h = hol[(m + 1) + '-' + d] || '';
        var cls = 'c' + (col === 0 ? ' sun' : col === 6 ? ' sat' : '') + (h ? ' hol' : '');
        var key = 'nenkan-' + year + pad(m + 1) + pad(d);
        var v = load(key).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/\n/g,'<br>');
        html += '<div class="' + cls + '"><div class="top"><span class="n">' + d + '</span><span class="h">' + h + '</span></div>' +
          '<div class="memo" contenteditable="true" role="textbox" aria-multiline="true" aria-label="' + (m + 1) + '月' + d + '日のメモ" data-k="' + key + '">' + v + '</div></div>';
      }
      html += '</div></section>';
    }
    cal.innerHTML = html;
  }

  cal.addEventListener('input', function(e){
    var t = e.target;
    if (t && t.classList && t.classList.contains('memo')){
      save(t.getAttribute('data-k'), t.innerText.replace(/\n+$/,''));
    }
  });
  cal.addEventListener('paste', function(e){
    var t = e.target;
    if (t && t.classList && t.classList.contains('memo')){
      e.preventDefault();
      var text = (e.clipboardData || window.clipboardData).getData('text') || '';
      document.execCommand('insertText', false, text);
    }
  });
  document.getElementById('b2026').onclick = function(){ render(2026); };
  document.getElementById('b2027').onclick = function(){ render(2027); };
  document.getElementById('bprint').onclick = function(){ window.print(); };

  document.getElementById('bsave').onclick = function(){
    var out = { app: 'nenkan-calendar', version: 1, savedAt: new Date().toISOString(), entries: store };
    var blob = new Blob([JSON.stringify(out, null, 2)], { type: 'application/json' });
    var a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = 'nenkan-calendar.json';
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    setTimeout(function(){ URL.revokeObjectURL(a.href); }, 1000);
    dirty = false;
    say('nenkan-calendar.json を保存しました。');
  };

  var fileIn = document.getElementById('fileIn');
  document.getElementById('bload').onclick = function(){ fileIn.click(); };
  fileIn.onchange = function(){
    var f = fileIn.files && fileIn.files[0];
    if (!f) return;
    var reader = new FileReader();
    reader.onload = function(){
      try {
        var obj = JSON.parse(reader.result);
        var src = obj && obj.entries;
        if (!src || typeof src !== 'object') throw new Error('形式が違います');
        var next = {};
        Object.keys(src).forEach(function(k){
          if (/^nenkan-\d{8}$/.test(k) && typeof src[k] === 'string' && src[k]) next[k] = src[k];
        });
        store = next;
        dirty = false;
        render(currentYear);
        say(f.name + ' を読み込みました(' + Object.keys(next).length + '件)。');
      } catch (e) {
        say('読み込めませんでした。このカレンダーで保存したJSONファイルを選んでください。');
      }
      fileIn.value = '';
    };
    reader.readAsText(f);
  };
  window.addEventListener('beforeunload', function(e){
    if (dirty){ e.preventDefault(); e.returnValue = ''; }
  });
  render(2027);
})();
</script>
</body>
</html>
